server.port=8080
spring.application.name=ecotrack-backend

# ─── Database (single MySQL schema for the whole app) ─────────────────────────
# Values come from environment variables (see .env.example). Sensible defaults
# are provided so the app runs out-of-the-box against a local MySQL "root" user.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecotrack}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Connection pool ──────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ─── File upload (item images) ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Override JWT_SECRET in .env for anything beyond local development.
# HS256 requires a secret of at least 32 characters.
jwt.secret=${JWT_SECRET:change-me-local-dev-secret-please-override-in-env-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── CORS — comma-separated allowed frontend origins ─────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ─── JSON & shutdown ──────────────────────────────────────────────────────────
server.shutdown=graceful
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
